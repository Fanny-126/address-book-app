services:
  address-book:
    build:
      context: .
      dockerfile: Dockerfile
    image: address-book:1.0.0
    container_name: address-book
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
